---
- name: Install Apache2 on Alpine Linux
  hosts: external:internal
  gather_facts: yes
  become: yes
  become_user: root
  
  tasks:

    - name: Install apache2
      community.general.apk:
        name: apache2
        state: present
        update_cache: false

    - name: Ensure httpd is enabled at and running now
      ansible.builtin.service:
        name: httpd
        enabled: true
        state: started
